---
# Desfaz o que o site.yml fez. A atualização do sistema não tem como desfazer.
- name: Rollback do Kali CTF no WSL2
  hosts: localhost
  become: true

  vars:
    usuario: "{{ lookup('env', 'SUDO_USER') or lookup('env', 'USER') }}"
    casa: "{{ ansible_facts['getent_passwd'][usuario][4] }}"
    # Mesma lista do site.yml
    pacotes:
      - kali-linux-headless
      - seclists
      - wordlists
      - kali-win-kex
      - burpsuite         # interceptar e alterar requisições web
      - wireshark         # abrir capturas .pcap com interface gráfica
      - steghide          # extrair dados escondidos em imagens/áudio
      - stegseek          # quebrar a senha do steghide com wordlist
      - sonic-visualiser  # ver espectrograma de áudio (mensagens escondidas)
      - hexedit           # editar arquivos em hexadecimal (consertar cabeçalho)
      - rlwrap            # setas e histórico no nc (shell reverso)
      - name-that-hash    # nth: descobrir o tipo de um hash

  environment:
    DEBIAN_FRONTEND: noninteractive

  pre_tasks:
    # Protege o rm do ~/.ssh: com usuário errado apagaria a pasta errada
    - name: Garantir que o usuário não é o root
      ansible.builtin.assert:
        that: usuario | length > 0 and usuario != 'root'
        fail_msg: "Rode como seu usuário normal: ansible-playbook rollback.yml (sem sudo, sem logar como root)"

    - name: Achar a pasta home do usuário
      ansible.builtin.getent:
        database: passwd
        key: "{{ usuario }}"

  tasks:
    - name: Voltar o hostname ao padrão do WSL (nome do Windows)
      ansible.builtin.blockinfile:
        path: /etc/wsl.conf
        marker: "# {mark} HOSTNAME (ansible)"
        state: absent

    - name: Devolver as pastas do Windows ao PATH
      ansible.builtin.blockinfile:
        path: /etc/wsl.conf
        marker: "# {mark} INTEROP (ansible)"
        state: absent

    - name: Tirar o VS Code do ~/.zshrc e do ~/.bashrc
      ansible.builtin.blockinfile:
        path: "{{ casa }}/{{ item }}"
        marker: "# {mark} VSCODE (ansible)"
        state: absent
      loop: [.zshrc, .bashrc]

    # Apaga também login, conversas e configurações: depois é preciso logar de novo
    - name: Remover Claude Code e Antigravity CLI (com dados de sessão)
      ansible.builtin.file:
        path: "{{ casa }}/{{ item }}"
        state: absent
      loop:
        - .local/bin/claude
        - .local/share/claude
        - .cache/claude
        - .cache/claude-cli-nodejs
        - .local/state/claude
        - .claude
        - .claude.json
        - .local/bin/agy
        - .cache/antigravity
        - .config/antigravity
        - .gemini

    - name: Listar tudo dentro do ~/.ssh
      ansible.builtin.find:
        paths: "{{ casa }}/.ssh"
        file_type: any
        hidden: true
      register: ssh

    - name: Apagar tudo dentro do ~/.ssh (rm -rf ~/.ssh/*)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ ssh.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Tirar o usuário dos grupos kismet e wireshark
      ansible.builtin.command: gpasswd -d {{ usuario }} {{ item }}
      loop: [kismet, wireshark]
      register: grupo
      changed_when: grupo.rc == 0
      failed_when: false

    - name: Apagar a rockyou.txt descompactada
      ansible.builtin.file:
        path: /usr/share/wordlists/rockyou.txt
        state: absent

    - name: Apagar a wordlist da CrackStation
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/share/wordlists/crackstation.txt
        - /usr/share/wordlists/crackstation.txt.part

    - name: Remover ferramentas, wordlists e Win-KeX
      ansible.builtin.apt:
        name: "{{ pacotes }}"
        state: absent
        purge: true

    # Remove o que veio junto (kismet, wireshark, macchanger, sslh...) e,
    # com o purge, as respostas das telas desses pacotes
    - name: Remover as dependências que sobraram
      ansible.builtin.apt:
        autoremove: true
        purge: true

    # libc6 não pode ser removido, então só volta a resposta ao padrão
    - name: Voltar a resposta da tela do libc6 ao padrão
      ansible.builtin.debconf:
        name: libc6
        question: libraries/restart-without-asking
        vtype: boolean
        value: "false"

  post_tasks:
    - name: AVISO - reinicie o WSL
      ansible.builtin.debug:
        msg:
          - "Rollback concluído. Falta reiniciar o WSL para tudo valer:"
          - "  - hostname volta ao padrão (nome do Windows)"
          - "  - pastas do Windows de volta no PATH"
          - "  - saída dos grupos kismet e wireshark"
          - "No PowerShell do Windows rode:  wsl --shutdown"
          - "Depois abra o Kali de novo."
