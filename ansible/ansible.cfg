[defaults]
# Inventário e roles locais (rode o ansible-playbook de dentro da pasta ansible/)
inventory = ./inventory/wsl.yml
roles_path = ./roles
retry_files_enabled = false

[privilege_escalation]
# Pede a senha do sudo uma vez no início (dispensa o --ask-become-pass)
become_ask_pass = true

[callback_default]
result_format = yaml
