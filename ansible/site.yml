---
- name: Kali CTF no WSL2
  hosts: localhost
  become: true

  vars:
    # Quem rodou o playbook, mesmo que tenha usado sudo
    usuario: "{{ lookup('env', 'SUDO_USER') or lookup('env', 'USER') }}"
    casa: "{{ ansible_facts['getent_passwd'][usuario][4] }}"
    nome_host: labs
    pacotes:
      - kali-linux-headless
      - seclists
      - wordlists
      - kali-win-kex
      - burpsuite         # interceptar e alterar requisições web
      - wireshark         # abrir capturas .pcap com interface gráfica
      - steghide          # extrair dados escondidos em imagens/áudio
      - stegseek          # quebrar a senha do steghide com wordlist
      - sonic-visualiser  # ver espectrograma de áudio (mensagens escondidas)
      - hexedit           # editar arquivos em hexadecimal (consertar cabeçalho)
      - rlwrap            # setas e histórico no nc (shell reverso)
      - name-that-hash    # nth: descobrir o tipo de um hash

    # Respostas das telas azuis que aparecem durante a instalação
    respostas:
      - { pacote: libc6,                  pergunta: libraries/restart-without-asking,       tipo: boolean, valor: "true" }
      - { pacote: keyboard-configuration, pergunta: keyboard-configuration/xkb-keymap,      tipo: select,  valor: us }
      - { pacote: kismet-capture-common,  pergunta: kismet-capture-common/install-setuid,   tipo: boolean, valor: "true" }
      - { pacote: kismet-capture-common,  pergunta: kismet-capture-common/install-users,    tipo: string,  valor: "{{ usuario }}" }
      - { pacote: macchanger,             pergunta: macchanger/automatically_run,           tipo: boolean, valor: "false" }
      - { pacote: wireshark-common,       pergunta: wireshark-common/install-setuid,        tipo: boolean, valor: "true" }
      - { pacote: sslh,                   pergunta: sslh/inetd_or_standalone,               tipo: select,  valor: standalone }

  environment:
    DEBIAN_FRONTEND: noninteractive

  pre_tasks:
    - name: Garantir que o usuário não é o root
      ansible.builtin.assert:
        that: usuario | length > 0 and usuario != 'root'
        fail_msg: "Rode como seu usuário normal: ansible-playbook site.yml (sem sudo, sem logar como root)"

    - name: Achar a pasta home do usuário
      ansible.builtin.getent:
        database: passwd
        key: "{{ usuario }}"

    # A senha da chave SSH só é pedida se a chave ainda não existir.
    # Fica aqui no começo para o resto da instalação seguir sem perguntas.
    - name: Ver se a chave SSH já existe
      ansible.builtin.stat:
        path: "{{ casa }}/.ssh/id_ed25519"
      register: chave_ssh

    - name: Pedir a senha da nova chave SSH
      when: not chave_ssh.stat.exists
      block:
        - name: Senha para a nova chave SSH
          ansible.builtin.pause:
            prompt: "Senha para a nova chave SSH"
            echo: false
          register: senha_ssh

        - name: Confirmar a senha
          ansible.builtin.pause:
            prompt: "Confirme a senha"
            echo: false
          register: senha_ssh_confirma

        - name: Conferir se as duas senhas são iguais
          ansible.builtin.assert:
            that: senha_ssh.user_input == senha_ssh_confirma.user_input
            fail_msg: "As senhas não batem. Rode o playbook de novo."
            quiet: true
          no_log: true

  tasks:
    - name: Responder as telas de configuração
      ansible.builtin.debconf:
        name: "{{ item.pacote }}"
        question: "{{ item.pergunta }}"
        vtype: "{{ item.tipo }}"
        value: "{{ item.valor }}"
      loop: "{{ respostas }}"

    - name: Atualizar o sistema
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Instalar ferramentas, wordlists e Win-KeX (demora)
      ansible.builtin.apt:
        name: "{{ pacotes }}"
        dpkg_options: force-confdef,force-confold

    - name: Liberar captura de pacotes sem sudo (grupos kismet e wireshark)
      ansible.builtin.user:
        name: "{{ usuario }}"
        groups: [kismet, wireshark]
        append: true

    - name: Descompactar a rockyou.txt
      ansible.builtin.shell: gzip -dc /usr/share/wordlists/rockyou.txt.gz > /usr/share/wordlists/rockyou.txt
      args:
        creates: /usr/share/wordlists/rockyou.txt

    # 4,5 GB para baixar e ~15 GB no disco. Baixa num .part e só renomeia
    # no fim, para um download interrompido não contar como pronto.
    - name: Baixar e descompactar a wordlist da CrackStation (demora)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          wget -qO- https://crackstation.net/files/crackstation.txt.gz
          | gzip -dc > /usr/share/wordlists/crackstation.txt.part &&
          mv /usr/share/wordlists/crackstation.txt.part /usr/share/wordlists/crackstation.txt
        executable: /bin/bash
        creates: /usr/share/wordlists/crackstation.txt

    # O WSL aplica o hostname e regenera o /etc/hosts no próximo boot
    - name: Trocar o hostname para {{ nome_host }}
      ansible.builtin.blockinfile:
        path: /etc/wsl.conf
        create: true
        marker: "# {mark} HOSTNAME (ansible)"
        block: |
          [network]
          hostname = {{ nome_host }}

    # O WSL junta todas as pastas do Windows (/mnt/c/...) ao PATH. Varrer
    # essas pastas é lento, e o Warp deixa os comandos vermelhos sem
    # reconhecer nenhum programa. Desligando, só o VS Code volta (abaixo).
    - name: Tirar as pastas do Windows do PATH
      ansible.builtin.blockinfile:
        path: /etc/wsl.conf
        create: true
        marker: "# {mark} INTEROP (ansible)"
        block: |
          [interop]
          appendWindowsPath = false

    # O cmd.exe reclama se a pasta atual não for do Windows, por isso o chdir
    - name: Descobrir o usuário do Windows
      ansible.builtin.command: /mnt/c/Windows/System32/cmd.exe /c "echo %USERNAME%"
      args:
        chdir: /mnt/c
      register: usuario_windows
      changed_when: false

    - name: Usar o zsh como shell padrão
      ansible.builtin.user:
        name: "{{ usuario }}"
        shell: /usr/bin/zsh

    # Vai nos dois arquivos para o code funcionar no zsh e no bash
    - name: Colocar o VS Code (code) de volta no PATH
      ansible.builtin.blockinfile:
        path: "{{ casa }}/{{ item }}"
        create: true
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
        mode: "0644"
        marker: "# {mark} VSCODE (ansible)"
        block: |
          vscode="/mnt/c/Users/{{ usuario_windows.stdout | trim }}/AppData/Local/Programs/Microsoft VS Code/bin"
          [ -d "$vscode" ] && export PATH="$PATH:$vscode"
          unset vscode
      loop: [.zshrc, .bashrc]

    # Sem isso o gpg não sabe em qual terminal abrir a tela da senha
    # (pinentry) e falha sem perguntar nada
    - name: Dizer ao gpg qual é o terminal (GPG_TTY)
      ansible.builtin.blockinfile:
        path: "{{ casa }}/{{ item }}"
        create: true
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
        mode: "0644"
        marker: "# {mark} GPG_TTY (ansible)"
        block: export GPG_TTY=$(tty)
      loop: [.zshrc, .bashrc]
      register: gpg_tty

    # O gpg-agent que já estava rodando guardou o terminal antigo
    - name: Reiniciar o gpg-agent
      become_user: "{{ usuario }}"
      ansible.builtin.command: gpgconf --kill gpg-agent
      when: gpg_tty.changed

    # O login e o kali-motd (/etc/profile.d/kali.sh) pulam a mensagem
    # quando esse arquivo existe
    - name: Esconder a mensagem de boas-vindas (~/.hushlogin)
      ansible.builtin.copy:
        content: ""
        dest: "{{ casa }}/.hushlogin"
        force: false
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
        mode: "0644"

    # A sessão gráfica (kex) roda o xdg-user-dirs-update, que cria Desktop,
    # Downloads, Documents etc. Apontando todas para a própria home e
    # desligando o update, nenhuma pasta é criada.
    - name: Criar a pasta ~/.config
      ansible.builtin.file:
        path: "{{ casa }}/.config"
        state: directory
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
        mode: "0755"

    - name: Não criar as pastas padrão (Downloads, Documents...)
      ansible.builtin.copy:
        dest: "{{ casa }}/.config/{{ item.arquivo }}"
        content: "{{ item.conteudo }}"
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
        mode: "0644"
      loop:
        - arquivo: user-dirs.conf
          conteudo: "enabled=False\n"
        - arquivo: user-dirs.dirs
          conteudo: |
            XDG_DESKTOP_DIR="$HOME/"
            XDG_DOWNLOAD_DIR="$HOME/"
            XDG_TEMPLATES_DIR="$HOME/"
            XDG_PUBLICSHARE_DIR="$HOME/"
            XDG_DOCUMENTS_DIR="$HOME/"
            XDG_MUSIC_DIR="$HOME/"
            XDG_PICTURES_DIR="$HOME/"
            XDG_VIDEOS_DIR="$HOME/"
            XDG_PROJECTS_DIR="$HOME/"
      loop_control:
        label: "{{ item.arquivo }}"

    # Se o kex já foi aberto antes do playbook, as pastas já existem.
    # Só apaga as que estão vazias, para não perder nada.
    - name: Apagar as pastas padrão que já existem e estão vazias
      ansible.builtin.command:
        argv:
          - find
          - "{{ casa }}"
          - -mindepth
          - "1"
          - -maxdepth
          - "1"
          - -type
          - d
          - -empty
          - (
          - -name
          - Desktop
          - -o
          - -name
          - Downloads
          - -o
          - -name
          - Templates
          - -o
          - -name
          - Public
          - -o
          - -name
          - Documents
          - -o
          - -name
          - Music
          - -o
          - -name
          - Pictures
          - -o
          - -name
          - Videos
          - -o
          - -name
          - Projects
          - )
          - -print
          - -delete
      register: pastas_vazias
      changed_when: pastas_vazias.stdout | length > 0

    # O Xfce do kex tenta iniciar as notificações pelo systemd do usuário.
    # Lá o programa não vê a tela do kex e cai no Wayland do WSLg, que não
    # tem o protocolo wlr-layer-shell: erro "Unable to start notification
    # daemon". Mascarado, o systemctl falha na hora e o Xfce abre o
    # programa direto, já na tela do kex.
    - name: Mascarar o xfce4-notifyd no systemd do usuário
      become_user: "{{ usuario }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][usuario][1] }}"
      ansible.builtin.systemd_service:
        name: xfce4-notifyd.service
        scope: user
        masked: true

    - name: Instalar Claude Code e Antigravity CLI
      become_user: "{{ usuario }}"
      environment:
        HOME: "{{ casa }}"
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL {{ item.url }} | bash
        executable: /bin/bash
        creates: "{{ casa }}/.local/bin/{{ item.bin }}"
      loop:
        - { url: "https://claude.ai/install.sh", bin: claude }
        - { url: "https://antigravity.google/cli/install.sh", bin: agy }

    - name: Criar a pasta ~/.ssh
      ansible.builtin.file:
        path: "{{ casa }}/.ssh"
        state: directory
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
        mode: "0700"

    # Se a chave já existir, não mexe nela
    - name: Gerar a chave SSH {{ usuario }}@{{ nome_host }}
      when: not chave_ssh.stat.exists
      become_user: "{{ usuario }}"
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -f, "{{ casa }}/.ssh/id_ed25519", -C, "{{ usuario }}@{{ nome_host }}", -N, "{{ senha_ssh.user_input }}"]
        creates: "{{ casa }}/.ssh/id_ed25519"
      no_log: true

  post_tasks:
    - name: AVISO - reinicie o WSL
      ansible.builtin.debug:
        msg:
          - "Instalação concluída. Falta reiniciar o WSL para tudo valer:"
          - "  - hostname '{{ nome_host }}'"
          - "  - PATH sem as pastas do Windows (comandos verdes no Warp)"
          - "  - zsh como shell padrão"
          - "  - grupos kismet e wireshark (captura sem sudo)"
          - "  - claude e agy no PATH"
          - "No PowerShell do Windows rode:  wsl --shutdown"
          - "Depois abra o Kali de novo."
