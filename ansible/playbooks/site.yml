---
# =============================================================================
# PLAYBOOK: Kali Linux no WSL2 — ambiente de CTF
# =============================================================================
# Automatiza o guia wsl2_kali.md (etapas 2 a 5). A etapa 1 (wsl --install)
# roda no Windows e continua manual.
# =============================================================================

- name: KALI CTF WORKSTATION
  hosts: localhost
  connection: local

  roles:
    - role: update_system
      when: setup.update_system | bool
    - role: kali_tools
      when: setup.kali_tools | bool
    - role: wordlists
      when: setup.wordlists | bool
    - role: win_kex
      when: setup.win_kex | bool
